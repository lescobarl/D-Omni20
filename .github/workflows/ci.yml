name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend · typecheck + validadores + suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Puerta de tipos
        run: npm run typecheck
      - name: Validadores CLAUDE (hardcode, trycatch, jsdoc)
        run: |
          npm run validate:hardcode
          npm run validate:trycatch
          npm run validate:jsdoc
      - name: Suite completa de tests
        run: npm run test:full

  backend:
    name: Backend · pytest + cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Suite completa de tests (con umbral de cobertura 80%)
        run: |
          set +e
          python -m pytest > /tmp/pytest.log 2>&1
          code=$?
          tail -c 4000 /tmp/pytest.log > /tmp/pytest-tail.txt
          python - <<'PYEOF'
          from pathlib import Path
          text = Path('/tmp/pytest-tail.txt').read_text(encoding='utf-8', errors='replace')
          safe = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print(f'::error file=.github/workflows/ci.yml,title=pytest (exit {code})::{safe[:3000]}')
          PYEOF
          exit $code
