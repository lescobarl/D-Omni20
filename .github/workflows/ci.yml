name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend · typecheck + validadores + suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Puerta de tipos
        run: npm run typecheck
      - name: Validadores CLAUDE (hardcode, trycatch, jsdoc)
        run: |
          npm run validate:hardcode
          npm run validate:trycatch
          npm run validate:jsdoc
      - name: Suite completa de tests
        run: npm run test:full

  # El job de backend corre en Windows para espejar el entorno local donde la
  # suite está verificada (la suite pasa 1255 tests con la config actual).
  backend:
    name: Backend · pytest + cobertura
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Suite completa de tests (con umbral de cobertura 80%)
        run: python -m pytest
