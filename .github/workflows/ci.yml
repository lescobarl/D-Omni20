# =============================================================================
# OmniBotIA Studio - CI/CD Pipeline (Fase 4.2)
#
# Contrato:
# - Se ejecuta en cada push a `main` y ramas `feature/*`, y en cada Pull Request.
# - Quality gates: cobertura > 80% (frontend y backend), validadores CLAUDE
#   (hardcode, trycatch, jsdoc, formato) y build de producción limpio.
# - `test:e2e` se ejecuta solo en `main` o manualmente (workflow_dispatch) por
#   el costo de instalar los 3 navegadores de Playwright.
# - Secrets requeridos para deploy a staging (opcional): STAGING_* (definidos en
#   los secrets del repositorio). Sin ellos, el job `deploy-staging` se omite.
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: validación CLAUDE + tests con cobertura + build de producción
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (validate + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate CLAUDE rules (hardcode, trycatch, jsdoc)
        run: npm run validate:hardcode && npm run validate:trycatch && npm run validate:jsdoc

      - name: Validate formatting (prettier)
        run: npm run validate:format

      - name: Run unit tests with coverage gate (>80%)
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-frontend
          path: frontend/dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Backend: lint + tests con cobertura
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (ruff + pytest coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check app tests

      - name: Run tests with coverage gate (>80%)
        run: |
          . .venv/bin/activate
          pytest

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/htmlcov/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # E2E: Playwright en main o manual (los 3 navegadores son costosos)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    needs: [frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Deploy a staging (opcional): requiere secrets STAGING_* del repositorio
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main' && vars.ENABLE_STAGING_DEPLOY == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy marker
        run: |
          echo "::notice title=Deploy::Staging deploy configurado."
          echo "Reemplaza este paso por tu pipeline de deploy (Coolify/Docker)."
          echo "Endpoint: ${{ vars.STAGING_URL }}"
