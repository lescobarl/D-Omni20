<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Confirmación de pago</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #1f2937; background: #f9fafb; margin: 0; padding: 24px;">
  <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; border: 1px solid #e5e7eb;">
    <h1 style="margin: 0 0 16px; font-size: 22px;">¡Gracias por tu compra{% if customer_name %}, {{ customer_name }}{% endif %}!</h1>
    <p style="font-size: 15px; line-height: 1.6;">Hemos recibido tu pago correctamente. A continuación el resumen de tu transacción:</p>
    <table style="width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px;">
      <tr>
        <td style="padding: 8px 0; color: #6b7280;">Monto</td>
        <td style="padding: 8px 0; text-align: right; font-weight: bold;">{{ amount }}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0; color: #6b7280;">Moneda</td>
        <td style="padding: 8px 0; text-align: right;">{{ currency }}</td>
      </tr>
    </table>
    <p style="font-size: 14px; color: #6b7280; line-height: 1.6;">Si tienes dudas, responde este correo y con gusto te ayudamos.</p>
  </div>
</body>
</html>
