# Configuración de Alembic para OmniBotIA Studio Backend.
# La URL real se inyecta desde ``app.config.settings`` (env.py) para no duplicar
# secretos en este archivo; el valor aquí es solo un fallback de desarrollo.
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./omnibotia_dev.db
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
